<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Price Tracker{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #f5f6fa; }
  .navbar-brand { font-weight: 600; }
  .stat-card .num { font-size: 2rem; font-weight: 700; }
  .stat-card .label { font-size: 0.8rem; color: #6c757d; }
  .badge-up   { color: #dc3545; font-size: 0.8em; font-weight: 600; }
  .badge-down { color: #198754; font-size: 0.8em; font-weight: 600; }
  .fuente-chip { padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.7rem; font-weight: 600; color: white; }
  .fuente-dia     { background: #e67e22; }
  .fuente-anonima { background: #dc3545; }
  .fuente-encombo  { background: #0d6efd; }
  .fuente-carrefour { background: #004A96; }
  .cheapest { background: #d1e7dd !important; font-weight: 600; }
  .cheapest a { color: #0f5132; }
  .multi-source { border-left: 3px solid #0d6efd; }
  th { font-size: 0.78rem; text-transform: uppercase; color: #6c757d; white-space: nowrap; }
  td { font-size: 0.875rem; }
  table { table-layout: auto; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3 mb-4">
  <a class="navbar-brand" href="/">Price Tracker</a>
  <div class="d-flex gap-3 align-items-center">
    <a class="nav-link text-white-50 {% if request.path == '/' %}text-white fw-semibold{% endif %}" href="/">Dashboard</a>
    <a class="nav-link text-white-50 {% if request.path == '/precios' %}text-white fw-semibold{% endif %}" href="/precios">Precios</a>
    <a class="nav-link text-white-50 {% if request.path == '/ahorro' %}text-white fw-semibold{% endif %}" href="/ahorro">Ahorro</a>
    <a class="nav-link text-white-50 {% if request.path == '/buscar' %}text-white fw-semibold{% endif %}" href="/buscar">Buscar</a>
    <a class="nav-link {% if request.path == '/carrito' %}text-white fw-semibold{% else %}text-white-50{% endif %} position-relative" href="/carrito" style="font-size:1.1rem" title="Mi carrito">
      🛒
      <span id="cart-badge" class="position-absolute badge rounded-pill bg-danger"
            style="font-size:0.55rem; top:2px; right:-4px; display:none; min-width:1.1em; padding:2px 4px">0</span>
    </a>
  </div>
</nav>
<div class="container-xl pb-5">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CART_KEY = 'pt_carrito';
// Cart stores numeric product IDs. Old string-based entries are silently ignored.
function getCart()      { return JSON.parse(localStorage.getItem(CART_KEY) || '[]').filter(i => typeof i === 'number' && i > 0); }
function saveCart(c)    { localStorage.setItem(CART_KEY, JSON.stringify(c)); updateBadge(); }
function addToCart(id)  {
  const c = getCart(), n = Number(id);
  if (n > 0 && !c.includes(n)) { c.push(n); saveCart(c); }
}
function removeFromCart(id) { const n = Number(id); saveCart(getCart().filter(i => i !== n)); }
function isInCart(id)   { return getCart().includes(Number(id)); }
function updateBadge() {
  const n = getCart().length;
  const b = document.getElementById('cart-badge');
  if (!b) return;
  b.textContent = n;
  b.style.display = n ? '' : 'none';
}
document.addEventListener('DOMContentLoaded', updateBadge);
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
