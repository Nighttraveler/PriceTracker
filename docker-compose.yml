services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  scraper:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    command: python scheduler.py
