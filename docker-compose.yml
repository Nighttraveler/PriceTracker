services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
    volumes:
      - ./data:/app/data
    depends_on:
      - db

volumes:
  postgres_data:
