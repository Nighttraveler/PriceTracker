services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    networks:
      - default
      - proxy # referencia a la red creada en el compose de traefik/pihole
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.pricetracker.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker.entrypoints=web"
      - "traefik.http.routers.pricetracker.service=pricetracker"
      # HTTPS
      - "traefik.http.routers.pricetracker-secure.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker-secure.entrypoints=websecure"
      - "traefik.http.routers.pricetracker-secure.tls=true"
      - "traefik.http.routers.pricetracker-secure.service=pricetracker"
      # Service
      - "traefik.http.services.pricetracker.loadbalancer.server.port=5000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time — must be the URL the
        # *browser* uses to reach the Flask API (Traefik public hostname or
        # http://localhost:5000 for local-only use).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    environment:
      # Used by the SSR Node server to call Flask internally at build time.
      API_URL: http://app:5000
      PORT: 3000
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "3000:3000"
    depends_on:
      - app

  scraper:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
      TZ: 'America/Argentina/Buenos_Aires'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    command: python scheduler.py


networks:
  proxy:
    external: true
  default:
    driver: bridge
