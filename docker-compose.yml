services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d price_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
      TZ: 'America/Argentina/Buenos_Aires'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # Kill a runaway query at the DB level so it can't pile up and starve the
      # Pi's CPU (should stay well below GUNICORN_TIMEOUT).
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      # Origins the *browser* loads the frontend from (comma-separated).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://pricetracker.home.arpa,https://pricetracker.home.arpa,http://pricetracker.home.arpa:3000,http://localhost:3000}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # /api en el mismo hostname que el frontend → mismo origen, sin CORS ni mixed content.
      # (regla más larga = mayor prioridad que la del frontend)
      - "traefik.http.routers.pricetracker-api.rule=Host(`pricetracker.home.arpa`) && PathPrefix(`/api`)"
      - "traefik.http.routers.pricetracker-api.entrypoints=web"
      - "traefik.http.routers.pricetracker-api.service=pricetracker-api"
      - "traefik.http.routers.pricetracker-api-secure.rule=Host(`pricetracker.home.arpa`) && PathPrefix(`/api`)"
      - "traefik.http.routers.pricetracker-api-secure.entrypoints=websecure"
      - "traefik.http.routers.pricetracker-api-secure.tls=true"
      - "traefik.http.routers.pricetracker-api-secure.service=pricetracker-api"
      - "traefik.http.services.pricetracker-api.loadbalancer.server.port=5000"
    networks:
      - default
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time. Empty = relative URLs
        # (same origin): Traefik rutea /api al servicio app en el mismo host.
        # Setear solo si el API vive en otro origen (requiere CORS).
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      # Used by the SSR Node server to call Flask internally at build time.
      API_URL: http://app:5000
      PORT: 3000
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.pricetracker.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker.entrypoints=web"
      - "traefik.http.routers.pricetracker.service=pricetracker"
      # HTTPS
      - "traefik.http.routers.pricetracker-secure.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker-secure.entrypoints=websecure"
      - "traefik.http.routers.pricetracker-secure.tls=true"
      - "traefik.http.routers.pricetracker-secure.service=pricetracker"
      # Service
      - "traefik.http.services.pricetracker.loadbalancer.server.port=3000"
    networks:
      - default
      - proxy # referencia a la red creada en el compose de traefik/pihole

  scraper:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
      TZ: 'America/Argentina/Buenos_Aires'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    command: python scheduler.py


networks:
  proxy:
    external: true
  default:
    driver: bridge
