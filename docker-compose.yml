services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
      TZ: 'America/Argentina/Buenos_Aires'
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    networks:
      - default
      - proxy # referencia a la red creada en el compose de traefik/pihole
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.pricetracker.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker.entrypoints=web"
      - "traefik.http.routers.pricetracker.service=pricetracker"
      # HTTPS
      - "traefik.http.routers.pricetracker-secure.rule=Host(`pricetracker.home.arpa`)"
      - "traefik.http.routers.pricetracker-secure.entrypoints=websecure"
      - "traefik.http.routers.pricetracker-secure.tls=true"
      - "traefik.http.routers.pricetracker-secure.service=pricetracker"
      # Service
      - "traefik.http.services.pricetracker.loadbalancer.server.port=5000"

  scraper:
    build: .
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/price_tracker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    command: python scheduler.py


networks:
  proxy:
    external: true
  default:
    driver: bridge
